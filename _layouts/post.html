<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: #fff;
      }
      
      h1, h2, h3, h4, h5, h6 {
        color: #000;
        margin-top: 2em;
        margin-bottom: 1em;
      }
      
      p, li {
        color: #000;
        margin-bottom: 1em;
      }
      
      a {
        color: #0366d6;
        text-decoration: none;
      }
      
      a:hover {
        text-decoration: underline;
      }
      
      .post-header {
        border-bottom: 1px solid #eee;
        padding-bottom: 1em;
        margin-bottom: 2em;
      }
      
      .post-meta {
        color: #666;
        font-size: 0.9em;
      }
      
      .back-link {
        margin-top: 3em;
        padding-top: 2em;
        border-top: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <div class="post-header">
      <h1>{{ page.title }}</h1>
      <div class="post-meta">{{ page.date | date: "%B %d, %Y" }}</div>
    </div>
    
    <div class="post-content">
      {{ content }}
    </div>
    
    <div class="back-link">
      <a href="{{ site.baseurl }}/gsoc2025/">← Back to GSoC Blog</a>
    </div>
  </body>
</html>
